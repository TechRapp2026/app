<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Rapportini Techne</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rapportini">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ===== l'unica riga da modificare è APP_URL nello script qui sotto ===== */
  html,body{margin:0;height:100%;background:#16212e;color:#e7edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0;background:#eef1f4}
  .msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .msg img{width:84px;height:84px;border-radius:18px}
  .msg p{margin:0;max-width:300px;line-height:1.45;color:#b8c4d0}
  .msg button{border:0;border-radius:10px;padding:12px 22px;font:600 16px system-ui,sans-serif;background:#5aa6ec;color:#061424}
  .spin{width:28px;height:28px;border:3px solid #2b3846;border-top-color:#5aa6ec;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="msg" id="load"><img src="icon-192.png" alt=""><div class="spin"></div><p>Apertura di Rapportini Techne…</p></div>
<div class="msg" id="off" hidden><img src="icon-192.png" alt=""><p><b>Nessuna connessione.</b><br>Il rapporto in corso resta salvato sul telefono. Riprova quando hai campo.</p><button type="button" id="retry">Riprova</button></div>
<div class="msg" id="cfg" hidden><p>Manca il link dell'app: inserisci in index.html il link che finisce con /exec.</p></div>
<iframe id="app" title="Rapportini Techne" allow="camera; clipboard-write" hidden></iframe>
<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbzUIlb99_x-_o0V3JeJ1gxRP358W9R5vnNUE-v6PAE2NgiSiDTMEegY7deeU17Ke8-frQ/exec";
  const $ = id => document.getElementById(id);
  function start() {
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) { $("load").hidden = true; $("cfg").hidden = false; return; }
    if (!navigator.onLine) { $("load").hidden = true; $("off").hidden = false; return; }
    $("off").hidden = true; $("load").hidden = false;
    const f = $("app"); f.onload = () => { $("load").hidden = true; f.hidden = false; };
    f.src = APP_URL;
  }
  $("retry").onclick = start;
  window.addEventListener("online", () => { if ($("app").hidden) start(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  start();
</script>
</body>
</html>
